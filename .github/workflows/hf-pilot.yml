name: Small HF block OCR pilot
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, labeled, reopened]
permissions:
  contents: read
jobs:
  pilot:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-hf-pilot')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
      OMP_THREAD_LIMIT: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin tesseract-ocr-mal
      - run: python -m pip install -e ".[hub]"
      - run: indicocr hub inspect --config configs/hf_indicdlp.yaml
      - run: python scripts/run_hf_pilot.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hf-pilot-summary
          # Summary contains metrics/provenance only: no images, labels, journals or credentials.
          path: |
            outputs/hf-pilot/summary.json
            outputs/hf-pilot/summary.md
            outputs/hf-pilot/summary.csv
          if-no-files-found: warn
          retention-days: 30
