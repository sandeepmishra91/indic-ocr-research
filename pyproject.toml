[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "indic-ocr-research"
version = "0.1.0"
description = "Offline Indic OCR research"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["Pillow>=10.4", "numpy>=1.26", "pypdf>=5", "pypdfium2>=4.30", "typer>=0.12", "PyYAML>=6"]
[project.optional-dependencies]
train = ["torch>=2.4"]
dev = ["pytest>=8", "ruff>=0.9"]
[project.scripts]
indicocr = "indic_ocr_research.cli:app"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
